	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const startDateInput = document.getElementById('start_date');
			const endDateInput = document.getElementById('end_date');
			const useAnnualLeave = document.getElementById('use_annual_leave');  // 사용 연차 표시 요소

			const todayStr = new Date().toISOString().split('T')[0];
			if (startDateInput && !startDateInput.value) {
				startDateInput.value = todayStr;
			}
			if (endDateInput && !endDateInput.value) {
				endDateInput.value = todayStr;
			}

			// 시작일 변경 시 종료일 최소값 설정
			startDateInput.addEventListener('change', function () {
				if (startDateInput.value) {
					endDateInput.min = startDateInput.value;
					updateAnnualLeave(); // 사용 연차 업데이트
				} else {
					endDateInput.removeAttribute('min');
				}
			});

			// 종료일 변경 시 시작일 최대값 설정
			endDateInput.addEventListener('change', function () {
				if (endDateInput.value) {
					startDateInput.max = endDateInput.value;
					updateAnnualLeave(); // 사용 연차 업데이트
				} else {
					startDateInput.removeAttribute('max');
				}
			});

			// 시작일과 종료일의 날짜 차이를 계산하고 표시하는 함수
			function updateAnnualLeave() {
				const startDate = new Date(startDateInput.value);
				const endDate = new Date(endDateInput.value);

				if (startDate && endDate && !isNaN(startDate) && !isNaN(endDate)) {
					const timeDifference = endDate - startDate; // 밀리초 단위 차이
					const dayDifference = timeDifference / (1000 * 3600 * 24) + 1; // 일 단위로 변환 (+1은 시작일 포함)

					if (dayDifference == 1) {
						document.getElementById("am").disabled = false;
						document.getElementById("pm").disabled = false;
					} else {
						document.getElementById("am").disabled = true;
						document.getElementById("pm").disabled = true;
						document.getElementById("am").checked = false;
						document.getElementById("pm").checked = false;
					}

					if (dayDifference > 0) {
						useAnnualLeave.textContent = dayDifference;  // 사용 연차 표시
					} else {
						useAnnualLeave.textContent = 0; // 날짜 차이가 0일이면 0으로 표시
					}
				} else {
					useAnnualLeave.textContent = 0; // 유효한 날짜가 아닌 경우 0으로 표시
				}
			}
		});
	</script>


	<script>

		// 처음 페이지로 들어오면 자동으로 맨 위에 양식이 클릭
		document.addEventListener("DOMContentLoaded", function () {
			// 첫 번째 버튼을 자동 클릭
			const firstButton = document.querySelector('.form-btn');
			if (firstButton) {
				firstButton.click();
			}
		});

		let editorInstance;

		const viewForm = function (approvalFormNo) {
			if (approvalFormNo !== null) {
				fetch('/approval/create/' + approvalFormNo, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						[document.querySelector('meta[name="_csrf_header"]').content]:
							document.querySelector('meta[name="_csrf"]').content
					}
				})
					.then(response => response.json())
					.then(data => {

						const approvalForm = data.approvalForm;
						const member = data.member;

						const form_div = document.getElementById('form_div');

						// 기존 hidden input 제거
						const oldInput = document.querySelector("input[name='approval_type_no']");
						if (oldInput) oldInput.remove();

						let form_no = document.createElement('input');
						form_no.setAttribute('type', 'hidden');
						form_no.setAttribute('id', 'approval_type_no');
						form_no.setAttribute('name', 'approval_type_no');
						form_no.setAttribute('value', `${approvalFormNo}`);
						form_div.appendChild(form_no);

						// 제목 삽입
						const titleElement = document.getElementById('approval_form_name');
						if (titleElement) {
							titleElement.innerText = approvalForm.approval_form_name;
						}

						// 작성 내용 초기화
						clearApprovalForm();

						// 기안자 정보 삽입
						/* document.querySelector("td[name='sender_name']").innerText = member.member_name;
						document.querySelector("td[name='dept_name']").innerText = member.dept_name;
						document.querySelector("td[name='pos_name']").innerText = member.pos_name; */

						// 연차 사용 안내 텍스트
						if (approvalForm.approval_form_type === 1) {
							document.getElementById('annualInfoText').style.display = '';
						} else {
							document.getElementById('annualInfoText').style.display = 'none';
						}

						// 기존 에디터가 있으면 제거
						if (editorInstance) {
							editorInstance.destroy()
								.then(() => {
									editorInstance = null;
									createEditor(approvalForm.approval_form);
								})
								.catch(error => {
									console.error('에디터 제거 중 오류:', error);
								});
						} else {
							createEditor(approvalForm.approval_form);
						}

						// 버튼 active 처리
						document.querySelectorAll('.btn-outline-info, .form-btn').forEach(btn => {

			const proxyArea = document.getElementById('proxyMemberSelectArea');
			const isProxyInput = document.getElementById('is_proxy');
			const targetSelect = document.getElementById('proxy_target_select');

			if (checkbox.checked) {

				resetSenderInfoToOriginal();
				return;
			}

			document.getElementById('target_member_no').value = select.value;

			const name = selectedOpt.getAttribute('data-name');
			const dept = selectedOpt.getAttribute('data-dept');
			const pos = selectedOpt.getAttribute('data-pos');
			const leave = selectedOpt.getAttribute('data-leave');

			document.querySelector("td[name='sender_name']").innerText = name + " (대리 기안)";
			document.querySelectorAll("td[name='dept_name']").forEach(el => el.innerText = dept);

			document.getElementById('annual_leave').value = leave;

			if (annualLeaveSpan) annualLeaveSpan.innerText = leave;

			if (typeof updateAnnualLeave === 'function') updateAnnualLeave();
		}

		function cleanScriptTags(html) {
			if (!html) return '';
			let cleaned = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
			const idx = cleaned.indexOf('document.addEventListener');
			if (idx !== -1) cleaned = cleaned.substring(0, idx);
			const idx2 = cleaned.indexOf('let editorInstance');
			if (idx2 !== -1) cleaned = cleaned.substring(0, idx2);
			return cleaned.trim();
		}

		const selectApprovalMember = function () {
			let approverList = document.querySelectorAll('.approver_li');
			if (approverList.length > 5) {
				alert('결재자는 최대 5명까지 지정할 수 있습니다.');
				return; // 더 이상 진행하지 않고 함수 종료
			}

			let approverThList = document.querySelectorAll('#approver th');
			let approverTdList = document.querySelectorAll('#approver_signature td');

			// 기존 내용 초기화
			approverThList.forEach(th => th.innerHTML = '');
			approverTdList.forEach(td => td.innerHTML = '');

			let index = 0;
			approverList.forEach(approver => {
				let button = approver.querySelector('.selected_approver');

				if (button && index < 5) {
					let approverId = button.value;
					let approverName = approver.innerText.replace('-', '').trim();
					approverName = approverName.split(' ')[0];

					// 해당 위치에 이름 삽입
					approverThList[index].textContent = '(' + (index + 1) + ') ' + approverName;

					// 서명란 입력 (예시로 서명 이미지나 텍스트가 들어갈 수 있음)
					approverTdList[index].textContent = '서명란';

					// hidden input 추가
					let input = document.createElement('input');
					input.type = 'hidden';
					input.name = 'approver_no';
					input.value = approverId;

					approverThList[index].appendChild(input);
					index++;
				}
			});

			// referencer
			let referencerList = document.querySelectorAll('.referencer_li');
			let referencerDiv = document.getElementById('referencer');
			referencerDiv.innerHTML = ''; // 초기화

			let index2 = 1;

			referencerList.forEach(referencer => {
				let button = referencer.querySelector('.selected_referencer');
				if (button) {
					let referencerId = button.value;
					let referencerName = referencer.innerText.replace('-', '').trim();
					referencerName = referencerName.split(' ')[0];


					if (!referencerDiv.querySelector(`span[data-referencer-id="${referencerId}"]`)) {
						let span = document.createElement('span');
						span.setAttribute('data-referencer-id', referencerId);
						span.setAttribute('name', 'referencerSpan');
						span.textContent = referencerName;



						let input = document.createElement('input');
						input.type = 'hidden';
						input.name = 'referencer_no';
						input.value = referencerId;

						span.appendChild(input);

						if (referencerList.length != index2) {
							referencerDiv.appendChild(span);
							referencerDiv.append(' / ');
						} else {
							referencerDiv.appendChild(span);
						}

					}
				}
				index2++;
			});

			// 모달 닫기
			bootstrap.Modal.getInstance(document.getElementById("approvalLineModal")).hide();
		};


		// 승인요청 버튼 클릭 시 결재 생성
		const createApprovalForm = document.create_approval_form;
		createApprovalForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			let valid = false;
			let valid_msg = '';

			const isConfirmed = await confirm('결재 요청을 보내시겠습니까?');
			if (!isConfirmed) return;

			const approverThList = document.querySelectorAll('#approver th');
			const hasApprover = Array.from(approverThList).some(th => th.textContent.trim() !== '');
			const hasReferencer = document.querySelectorAll("input[name='referencer_no']").length > 0;
			const agreementerThList = document.querySelectorAll('#agreementer th');
			const hasAgreementer = Array.from(agreementerThList).some(th => th.textContent.trim() !== '');

			if (!createApprovalForm.appr_title.value) {
				valid_msg += '결재 제목을 입력해주세요.';
			} else if (!createApprovalForm.start_date.value) {
				valid_msg += '시작일을 입력해주세요.';
			} else if (!createApprovalForm.end_date.value) {
				valid_msg += '종료일 입력해주세요.';
			} else if (!hasApprover && !hasReferencer && !hasAgreementer) {
				valid_msg += '결재자 또는 참조/회람자는 1명 이상 등록되어야 합니다.';
			} else {
				valid = true;
			}

			if (document.getElementById('is_proxy_check').checked && !document.getElementById('target_member_no').value) {
				alert('대리 기안 대상 사원을 선택해주세요.');
				return;
			}

			if (valid == false) {
				alert(valid_msg);
			} else {
				document.querySelector("input[name='appr_text']").value = cleanScriptTags(editorInstance.getData());
				let payload = new FormData(createApprovalForm);
				let annual_leave = document.getElementById('annual_leave').value;
				let use_annual_leave = document.getElementById('use_annual_leave').innerText;
				console.log('사용연차 : ' + use_annual_leave);
				if (document.getElementById('approval_type_no').value == 1) {
					if (parseFloat(document.getElementById('use_annual_leave').innerText) > parseFloat(document.getElementById('annual_leave').value)) {
						alert('사용연차가 남은연차보다 많습니다.');
						return;
					}
				}
				let annual_leave_type = 0;
				if (document.getElementById('am').checked) {
					annual_leave_type = 1;
				}
				if (document.getElementById('pm').checked) {
					annual_leave_type = 2;
				}

				payload.append('use_annual_leave', use_annual_leave);
				payload.append('annual_leave_type', annual_leave_type);

				const csrfToken = document.querySelector('meta[name="_csrf"]').content;
				const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
				payload.append('_csrf', csrfToken);
				fetch('/approval/create', {
					method: 'post',
					body: payload,
					headers: {
						[csrfHeader]: csrfToken
					},
					credentials: 'include'
				})
					.then(response => response.json())
					.then(async data => {
						await alert(data.res_msg);
						if (data.res_code == '200') {
							location.href = '/approval';
						}
					})
			}
		})


	</script>
